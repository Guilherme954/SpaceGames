<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Space Games</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h1>🚀 Space Games</h1>

        <ul>
            <li class="active" data-filter="all">Library</li>
            <li data-filter="installed">Instalados</li>
            <li data-filter="favorites">Favoritos</li>
        </ul>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <div class="header">
            <input type="text" id="search" placeholder="Search store">

            <div class="menu">
                <span>Discover</span>
                <span>Browse</span>
                <span>News</span>
            </div>

            <div class="user">👤 Guilherme</div>
        </div>

        <!-- GRID -->
        <div class="grid">

            <div class="card" data-name="Ghostrunner">
                <img src="https://picsum.photos/300/400?1">
                <div class="overlay">
                    <h3>Ghostrunner</h3>
                    <div class="actions">
                        <button class="install">Install</button>
                        <span class="fav">♡</span>
                    </div>
                </div>
            </div>

            <div class="card" data-name="Atari Mania">
                <img src="https://picsum.photos/300/400?2">
                <div class="overlay">
                    <h3>Atari Mania</h3>
                    <div class="actions">
                        <button class="install">Install</button>
                        <span class="fav">♡</span>
                    </div>
                </div>
            </div>

            <div class="card" data-name="Sail Forth">
                <img src="https://picsum.photos/300/400?3">
                <div class="overlay">
                    <h3>Sail Forth</h3>
                    <div class="actions">
                        <button class="install">Install</button>
                        <span class="fav">♡</span>
                    </div>
                </div>
            </div>

        </div>

    </main>

</div>

<script src="script.js"></script>
</body>
</html>
